<!DOCTYPE html>
<html>
<head>
    <title>WAYTO - Contact</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f4f7; max-width: 500px; margin: 60px auto; }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 12px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #2d6cdf; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Contact Us</h1>
    <p>Email: wayto@example.com</p>
    <form>
        <input type="text" placeholder="Your name" required>
        <input type="email" placeholder="Your email" required>
        <textarea placeholder="Message" rows="4" required></textarea>
        <button type="submit">Send</button>
    </form>
</body>
</html>
