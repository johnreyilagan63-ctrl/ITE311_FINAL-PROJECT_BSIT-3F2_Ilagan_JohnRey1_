<!DOCTYPE html>
<html>
<head>
    <title>WAYTO - Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f2f4f7; display: flex; flex-direction: column; align-items: center; margin-top: 80px; }
        form { background: white; padding: 25px; border-radius: 8px; width: 280px; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        input { width: 100%; padding: 10px; margin-bottom: 12px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #2d6cdf; color: white; border: none; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>Login</h1>
    <form>
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Sign in</button>
    </form>
</body>
</html>
